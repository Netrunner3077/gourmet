services:
  db:
    image: mongo:6.0
    container_name: gourmet-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: gourmet-app
    environment:
      # Настройки для отрисовки GUI на Windows
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
      # Переопределяем адрес БД: теперь это не localhost, а имя сервиса "db"
      - MONGO_URI=mongodb://db:27017/
    volumes:
      - .:/app
    security_opt:
      - seccomp:unconfined
    depends_on:
      - db

volumes:
  mongo_data: